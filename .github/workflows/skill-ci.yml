name: Skill CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python:
          - "3.11"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Validate skill package
        run: python scripts/validate_skill.py

      - name: Validate behavioral evals
        run: python scripts/validate_evals.py

      - name: Validate live benchmark harness
        run: python scripts/validate_benchmarks.py

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Compile Python tooling
        run: >-
          python -m py_compile
          scripts/validate_skill.py
          scripts/validate_evals.py
          scripts/validate_benchmarks.py
          scripts/live_benchmark.py
          scripts/run_live_benchmark.py
          skills/fukurou-development/scripts/install.py
          tests/test_installer.py
          tests/test_evals.py
          tests/test_live_benchmark.py
          tests/test_benchmark_entrypoint.py
